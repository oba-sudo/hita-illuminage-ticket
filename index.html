<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>日田イルミナージュ QRチケット</title>
<style>
  *{ box-sizing:border-box; }
  body{
    margin:0; min-height:100vh; background:#05070c;
    display:flex; align-items:center; justify-content:center;
    padding:20px 12px;
    font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic", "Noto Sans JP", sans-serif;
  }
  .card{
    position:relative;
    width:100%;
    max-width:420px;
    aspect-ratio: 850 / 1851;
    border-radius:14px;
    overflow:hidden;
    box-shadow: 0 24px 50px rgba(0,0,0,0.55);
    background-size:100% 100%;
    background-position:center;
    background-repeat:no-repeat;
  }
  .nameOverlay{
    position:absolute;
    background:#000;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:0 4%;
    line-height:1.35;
  }
  .nameOverlay .main{
    font-family: "Hiragino Mincho ProN", "Yu Mincho", serif;
    font-weight:700;
    color:#f2ede1;
    font-size: clamp(15px, 5.2vw, 23px);
  }
  .nameOverlay .sub{
    color:#caa24d;
    letter-spacing:0.08em;
    margin-top: 0.6em;
    font-size: clamp(9px, 2.6vw, 12px);
  }
  .footerOverlay{
    position:absolute;
    background:#000;
    display:flex;
    align-items:center;
    color:#f2ede1;
    font-size: clamp(9px, 2.6vw, 11px);
    line-height:1;
  }
  .silhouetteOverlay{
    position:absolute;
    background:#000;
  }
  .pill{
    position:absolute;
    border-radius:999px;
    display:flex; align-items:center; justify-content:center;
    font-weight:700;
    letter-spacing:0.15em;
    border: 1.5px solid #caa24d;
    box-shadow: inset 0 0 8px rgba(0,0,0,0.5);
    transition: background 0.2s ease, color 0.2s ease;
  }
  .pill.unused{ background: linear-gradient(180deg,#1a2e52,#101d38); color:#f2ede1; }
  .pill.used{ background: linear-gradient(180deg,#4b5972,#333f54); color:#c9d2e0; }
  .pill span{ font-size: clamp(11px, 3.4vw, 16px); }

  .btn{
    position:absolute;
    border-radius:999px;
    border: 1.5px solid #d9b463;
    display:flex; align-items:center; justify-content:center;
    gap:8px;
    font-weight:700;
    cursor:pointer;
    transition: filter 0.15s ease;
  }
  .btn:active{ filter:brightness(0.9); }
  .btn.unused{
    background: linear-gradient(180deg,#7a2013,#3d0f09 70%);
    color:#f0c877;
    box-shadow: inset 0 0 14px rgba(0,0,0,0.5), 0 4px 10px rgba(0,0,0,0.4);
  }
  .btn.used{
    background: linear-gradient(180deg,#4a5566,#30384a 70%);
    color:#aab4c4;
    cursor:default;
    box-shadow: inset 0 0 14px rgba(0,0,0,0.4);
  }
  .btn span.label{ font-size: clamp(13px, 4.3vw, 20px); letter-spacing:0.08em; }
  .btn span.arrow{ font-size: clamp(13px, 4vw, 18px); }

  .used-at{
    position:absolute; left:14%; width:72%;
    text-align:center; color:#8FA0BC; font-size: clamp(9px, 2.6vw, 11px);
  }

</style>
</head>
<body>

<div class="card" id="card"></div>

<script>
  // pos: [badgeLeft%, badgeWidth%, badgeTop%, badgeHeight%, btnLeft%, btnWidth%, btnTop%, btnHeight%]
  // nameBox (optional): [left%, width%, top%, height%] — black overlay covering baked-in store name, for combined-store display
  const stores = {
    attackontitan: {
      name: "進撃の巨人 in HITAミュージアムANNEX・進撃の日田カフェ",
      nameSub: "ATTACK ON TITAN MUSEUM ANNEX & CAFE",
      img: "museum.png",
      pos: [29.41,40.0,71.31,2.97, 14.12,71.76,75.63,4.48],
      nameBox: [7.06,87.06,27.01,23.77],
      footerName: "進撃の巨人ミュージアム・カフェ",
      footerBox: [35.88,54.71,95.52,2.43],
      silhouetteBox: [67.06,27.65,83.74,11.62]
    },
    sapporo: {
      name: "日田森のビール園",
      img: "sapporo.png",
      pos: [29.34,39.91,72.20,2.98, 11.74,73.94,76.64,3.96]
    }
  };
  // old individual-store links still resolve to the combined ticket
  const aliasMap = { museum: "attackontitan", cafe: "attackontitan" };

  const params = new URLSearchParams(window.location.search);
  let requested = params.get("store");
  requested = aliasMap[requested] || requested;
  let storeId = stores[requested] ? requested : "attackontitan";
  let deviceId = null;

  const card = document.getElementById("card");
  card.innerHTML = `
    <div class="nameOverlay" id="nameOverlay" style="display:none;">
      <div class="main" id="nameMain"></div>
      <div class="sub" id="nameSub"></div>
    </div>
    <div class="footerOverlay" id="footerOverlay" style="display:none;"></div>
    <div class="silhouetteOverlay" id="silhouetteOverlay" style="display:none;"></div>
    <div class="pill unused" id="pill"><span>未使用</span></div>
    <div class="btn unused" id="btn"><span class="label">利用する</span><span class="arrow">›</span></div>
    <div class="used-at" id="usedAt"></div>
  `;
  const nameOverlay = document.getElementById("nameOverlay");
  const nameMain = document.getElementById("nameMain");
  const nameSub = document.getElementById("nameSub");
  const footerOverlay = document.getElementById("footerOverlay");
  const silhouetteOverlay = document.getElementById("silhouetteOverlay");
  const pill = document.getElementById("pill");
  const btn = document.getElementById("btn");
  const usedAtEl = document.getElementById("usedAt");

  function applyPosition(){
    const store = stores[storeId];
    const [bl,bw,bt,bh, xl,xw,xt,xh] = store.pos;
    pill.style.left = bl + "%";
    pill.style.width = bw + "%";
    pill.style.top = bt + "%";
    pill.style.height = bh + "%";
    btn.style.left = xl + "%";
    btn.style.width = xw + "%";
    btn.style.top = xt + "%";
    btn.style.height = xh + "%";
    usedAtEl.style.top = (xt + xh + 1.2) + "%";

    if(store.nameBox){
      const [nl,nw,nt,nh] = store.nameBox;
      nameOverlay.style.left = nl + "%";
      nameOverlay.style.width = nw + "%";
      nameOverlay.style.top = nt + "%";
      nameOverlay.style.height = nh + "%";
      nameMain.textContent = store.name;
      nameSub.textContent = store.nameSub || "";
      nameOverlay.style.display = "flex";
    } else {
      nameOverlay.style.display = "none";
    }

    if(store.footerBox){
      const [fl,fw,ft,fh] = store.footerBox;
      footerOverlay.style.left = fl + "%";
      footerOverlay.style.width = fw + "%";
      footerOverlay.style.top = ft + "%";
      footerOverlay.style.height = fh + "%";
      footerOverlay.textContent = store.footerName;
      footerOverlay.style.display = "flex";
    } else {
      footerOverlay.style.display = "none";
    }

    if(store.silhouetteBox){
      const [sl,sw,st,sh] = store.silhouetteBox;
      silhouetteOverlay.style.left = sl + "%";
      silhouetteOverlay.style.width = sw + "%";
      silhouetteOverlay.style.top = st + "%";
      silhouetteOverlay.style.height = sh + "%";
      silhouetteOverlay.style.display = "block";
    } else {
      silhouetteOverlay.style.display = "none";
    }
  }

  function setBackground(){ card.style.backgroundImage = `url(${stores[storeId].img})`; }
  function statusKey(){ return `hita-ticket:${storeId}:${deviceId}`; }
  function getStatus(){
    try{ const raw = localStorage.getItem(statusKey()); return raw ? JSON.parse(raw) : { used:false }; }
    catch(e){ return { used:false }; }
  }
  function setUsed(){
    const data = { used:true, at: new Date().toLocaleString("ja-JP") };
    try{ localStorage.setItem(statusKey(), JSON.stringify(data)); }catch(e){}
    return data;
  }
  function renderState(){
    const status = getStatus();
    if(status.used){
      pill.className = "pill used"; pill.innerHTML = "<span>使用済み</span>";
      btn.className = "btn used"; btn.innerHTML = '<span class="label">利用済みです</span>';
      usedAtEl.textContent = status.at ? `利用日時: ${status.at}` : "";
    } else {
      pill.className = "pill unused"; pill.innerHTML = "<span>未使用</span>";
      btn.className = "btn unused"; btn.innerHTML = '<span class="label">利用する</span><span class="arrow">›</span>';
      usedAtEl.textContent = "";
    }
  }
  btn.addEventListener("click", () => {
    const status = getStatus();
    if(status.used) return;
    btn.innerHTML = '<span class="label">処理中...</span>';
    setUsed();
    renderState();
  });

  deviceId = localStorage.getItem("hita-ticket-device-id");
  if(!deviceId){
    deviceId = "dev-" + Math.random().toString(36).slice(2,10);
    try{ localStorage.setItem("hita-ticket-device-id", deviceId); }catch(e){}
  }
  applyPosition();
  setBackground();
  renderState();
</script>
</body>
</html>
