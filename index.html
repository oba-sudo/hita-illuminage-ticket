<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>日田イルミナージュ QRチケット</title>
<style>
  *{ box-sizing:border-box; }
  html,body{
    margin:0; min-height:100vh; background:#05070c;
    display:flex; align-items:center; justify-content:center;
    padding:20px 12px;
    font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic", "Noto Sans JP", sans-serif;
  }
  .card{
    position:relative;
    width:100%;
    max-width:420px;
    aspect-ratio: 850 / 1851;
    border-radius:14px;
    overflow:hidden;
    box-shadow: 0 24px 50px rgba(0,0,0,0.55);
    background-size:100% 100%;
    background-position:center;
    background-repeat:no-repeat;
  }
  .pill{
    position:absolute;
    left:29.2%; width:41%;
    top:70.9%; height:3.4%;
    border-radius:999px;
    display:flex; align-items:center; justify-content:center;
    font-weight:700;
    letter-spacing:0.15em;
    border: 1.5px solid #caa24d;
    box-shadow: inset 0 0 8px rgba(0,0,0,0.5);
    transition: background 0.2s ease, color 0.2s ease;
  }
  .pill.unused{ background: linear-gradient(180deg,#1a2e52,#101d38); color:#f2ede1; }
  .pill.used{ background: linear-gradient(180deg,#4b5972,#333f54); color:#c9d2e0; }
  .pill span{ font-size: clamp(11px, 3.4vw, 16px); }

  .btn{
    position:absolute;
    left:13.8%; width:72.4%;
    top:75.2%; height:4.9%;
    border-radius:999px;
    border: 1.5px solid #d9b463;
    display:flex; align-items:center; justify-content:center;
    gap:8px;
    font-weight:700;
    cursor:pointer;
    transition: filter 0.15s ease;
  }
  .btn:active{ filter:brightness(0.9); }
  .btn.unused{
    background: linear-gradient(180deg,#7a2013,#3d0f09 70%);
    color:#f0c877;
    box-shadow: inset 0 0 14px rgba(0,0,0,0.5), 0 4px 10px rgba(0,0,0,0.4);
  }
  .btn.used{
    background: linear-gradient(180deg,#4a5566,#30384a 70%);
    color:#aab4c4;
    cursor:default;
    box-shadow: inset 0 0 14px rgba(0,0,0,0.4);
  }
  .btn span.label{ font-size: clamp(13px, 4.3vw, 20px); letter-spacing:0.08em; }
  .btn span.arrow{ font-size: clamp(13px, 4vw, 18px); }

  .used-at{
    position:absolute; left:14%; width:72%; top:80.4%;
    text-align:center; color:#8FA0BC; font-size: clamp(9px, 2.6vw, 11px);
  }

  .switcher{
    position:fixed; left:0; right:0; bottom:10px;
    display:flex; justify-content:center; gap:8px; z-index:5;
  }
  .switcher button{
    font-size:11px; padding:6px 10px; border-radius:8px;
    border:1px solid rgba(217,165,68,0.4); background:rgba(20,30,50,0.85);
    color:#D9A544; cursor:pointer;
  }
  .switcher button.active{ background:#D9A544; color:#241606; }
  .switcher-note{
    position:fixed; left:0; right:0; bottom:38px; text-align:center;
    font-size:10px; color:rgba(143,160,188,0.7);
  }
</style>
</head>
<body>

<div class="card" id="card"></div>
<div class="switcher-note" id="switcherNote"></div>
<div class="switcher" id="switcher"></div>

<script>
  const stores = {
    museum:  { name: "進撃の巨人ミュージアム", img: "museum.pmg" },
    cafe:    { name: "進撃の巨人カフェ",       img: "cafe.png" },
    sapporo: { name: "日田森のビール園",       img: "sapporo.png" }
  };

  const params = new URLSearchParams(window.location.search);
  let storeId = stores[params.get("store")] ? params.get("store") : "museum";
  let deviceId = null;
  const hasStoreParam = !!stores[params.get("store")];

  const card = document.getElementById("card");
  card.innerHTML = `
    <div class="pill unused" id="pill"><span>未使用</span></div>
    <div class="btn unused" id="btn"><span class="label">利用する</span><span class="arrow">›</span></div>
    <div class="used-at" id="usedAt"></div>
  `;
  const pill = document.getElementById("pill");
  const btn = document.getElementById("btn");
  const usedAtEl = document.getElementById("usedAt");

  function setBackground(){ card.style.backgroundImage = `url(${stores[storeId].img})`; }
  function statusKey(){ return `hita-ticket:${storeId}:${deviceId}`; }
  function getStatus(){
    try{ const raw = localStorage.getItem(statusKey()); return raw ? JSON.parse(raw) : { used:false }; }
    catch(e){ return { used:false }; }
  }
  function setUsed(){
    const data = { used:true, at: new Date().toLocaleString("ja-JP") };
    try{ localStorage.setItem(statusKey(), JSON.stringify(data)); }catch(e){}
    return data;
  }
  function renderState(){
    const status = getStatus();
    if(status.used){
      pill.className = "pill used"; pill.innerHTML = "<span>使用済み</span>";
      btn.className = "btn used"; btn.innerHTML = '<span class="label">利用済みです</span>';
      usedAtEl.textContent = status.at ? `利用日時: ${status.at}` : "";
    } else {
      pill.className = "pill unused"; pill.innerHTML = "<span>未使用</span>";
      btn.className = "btn unused"; btn.innerHTML = '<span class="label">利用する</span><span class="arrow">›</span>';
      usedAtEl.textContent = "";
    }
  }
  btn.addEventListener("click", () => {
    const status = getStatus();
    if(status.used) return;
    btn.innerHTML = '<span class="label">処理中...</span>';
    setUsed();
    renderState();
  });

  const switcherEl = document.getElementById("switcher");
  const switcherNote = document.getElementById("switcherNote");
  if(!hasStoreParam){
    switcherNote.textContent = "※本番では店舗ごとに専用URL/QRを発行します(以下は確認用)";
    Object.keys(stores).forEach(id => {
      const b = document.createElement("button");
      b.textContent = stores[id].name;
      b.className = id === storeId ? "active" : "";
      b.onclick = () => {
        storeId = id;
        [...switcherEl.children].forEach(c => c.className = "");
        b.className = "active";
        setBackground();
        renderState();
      };
      switcherEl.appendChild(b);
    });
  }

  deviceId = localStorage.getItem("hita-ticket-device-id");
  if(!deviceId){
    deviceId = "dev-" + Math.random().toString(36).slice(2,10);
    try{ localStorage.setItem("hita-ticket-device-id", deviceId); }catch(e){}
  }
  setBackground();
  renderState();
</script>
</body>
</html>
