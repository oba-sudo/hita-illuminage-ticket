<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>日田イルミナージュ 提携施設 割引Webチケット</title>
<style>
  *{ box-sizing:border-box; }
  body{
    margin:0; min-height:100vh; background:#05070c;
    display:flex; align-items:center; justify-content:center;
    padding:20px 12px;
    font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic", "Noto Sans JP", sans-serif;
  }
  .card{
    position:relative;
    width:100%;
    max-width:420px;
    aspect-ratio: 852 / 1845;
    border-radius:14px;
    overflow:hidden;
    box-shadow: 0 24px 50px rgba(0,0,0,0.55);
    background-size:100% 100%;
    background-position:center;
    background-repeat:no-repeat;
  }
  .pill{ position:absolute; border-radius:999px; display:flex; align-items:center; justify-content:center; font-weight:700; letter-spacing:0.15em; border: 1.5px solid #caa24d; box-shadow: inset 0 0 8px rgba(0,0,0,0.5); transition: background 0.2s ease, color 0.2s ease; }
  .pill.unused{ background: linear-gradient(180deg,#1a2e52,#101d38); color:#f2ede1; }
  .pill.used{ background: linear-gradient(180deg,#4b5972,#333f54); color:#c9d2e0; }
  .btn{ position:absolute; border-radius:999px; border: 1.5px solid #d9b463; display:flex; align-items:center; justify-content:center; gap:8px; font-weight:700; cursor:pointer; transition: filter 0.15s ease; }
  .btn.unused{ background: linear-gradient(180deg,#7a2013,#3d0f09 70%); color:#f0c877; box-shadow: inset 0 0 14px rgba(0,0,0,0.5), 0 4px 10px rgba(0,0,0,0.4); }
  .btn.used{ background: linear-gradient(180deg,#4a5566,#30384a 70%); color:#aab4c4; cursor:default; box-shadow: inset 0 0 14px rgba(0,0,0,0.4); }

</style>
</head>
<body>
<div class="card" id="card"></div>
<script>
  const stores = {
    attackontitan: {
      name: "進撃の巨人 in HITAミュージアムANNEX・進撃の日田カフェ",
      img: "museum.png",
      pos: [30.75,38.73,63.31,2.93, 15.26,69.48,67.75,4.50]
    },
    employee: {
      name: "従業員ご優待券",
      img: "employee.png",
      aspect: "1556 / 1011",
      maxWidth: 560,
      cq: true,
      pos: [59.58,31.11,66.37,7.32, 59.19,31.56,74.78,10.19]
    },
    sapporo: {
      name: "日田森のビール園",
      img: "sapporo.png",
      pos: [29.58,38.85,66.13,2.71, 16.43,66.90,70.35,4.17]
    }
  };
  const aliasMap = { museum: "attackontitan", cafe: "attackontitan" };

  // ===== 従業員向け共通チケット（会社別IDで記録を分ける）=====
  const employee = {
    ids: {
      "emp-sapporo-factory": "サッポロビール九州日田工場",
      "emp-sapporo-logi":    "サッポログループ物流",
      "emp-monriku":         "(株)モンリク",
      "emp-nbs":             "(株)NBSロジソル",
      "emp-adecco":          "アデコ(株)",
      "emp-create":          "(株)クリエイト・レストランツ",
      "emp-cross8":          "(株)クロス・エイト・ワールド",
      "emp-ryokuchi":        "日田緑地造園業協同組合"
    }
  };


  const params = new URLSearchParams(location.search);
  let storeId = params.get("store") || "attackontitan";
  if (aliasMap[storeId]) storeId = aliasMap[storeId];
  const isEmp = Object.prototype.hasOwnProperty.call(employee.ids, storeId);
  if (!isEmp && !stores[storeId]) storeId = "attackontitan";
  const cfg = isEmp ? stores.employee : stores[storeId];

  const card = document.getElementById("card");

  card.innerHTML = `
    <div class="pill unused" id="pill">未使用</div>
    <div class="btn unused" id="btn">利用する ›</div>
  `;

  const pill = document.getElementById("pill");
  const btn = document.getElementById("btn");

  function applyPosition(){
    const store = cfg;
    if (store.aspect){ card.style.aspectRatio = store.aspect; }
    if (store.maxWidth){ card.style.maxWidth = store.maxWidth + "px"; }
    if (store.cq){ card.style.containerType = "inline-size"; }
    const [pl,pw,pt,ph, bl,bw,bt,bh] = store.pos;
    pill.style.left = pl + "%";
    pill.style.width = pw + "%";
    pill.style.top = pt + "%";
    pill.style.height = ph + "%";
    pill.style.fontSize = store.cq ? "2.7cqw" : "clamp(11px, 3.2vw, 15px)";

    btn.style.left = bl + "%";
    btn.style.width = bw + "%";
    btn.style.top = bt + "%";
    btn.style.height = bh + "%";
    btn.style.fontSize = store.cq ? "3.8cqw" : "clamp(14px, 4.6vw, 20px)";
  }

  function setBackground(){
    card.style.backgroundImage = `url(${cfg.img})`;
  }

  function deviceId(){
    let id = localStorage.getItem("hita-ticket-device-id");
    if (!id){
      id = "d-" + Math.random().toString(36).slice(2) + Date.now().toString(36);
      localStorage.setItem("hita-ticket-device-id", id);
    }
    return id;
  }
  const did = deviceId();

  function statusKey(){ return `hita-ticket:${storeId}:${did}`; }

  function getStatus(){
    try{
      const raw = localStorage.getItem(statusKey());
      return raw ? JSON.parse(raw) : { used:false, usedAt:null };
    }catch(e){
      return { used:false, usedAt:null };
    }
  }

  function setUsed(){
    const status = { used:true, usedAt: new Date().toISOString() };
    localStorage.setItem(statusKey(), JSON.stringify(status));
    renderState();
  }

  function renderState(){
    const status = getStatus();
    if (status.used){
      pill.textContent = "使用済み";
      pill.classList.remove("unused");
      pill.classList.add("used");
      btn.textContent = "利用済み";
      btn.classList.remove("unused");
      btn.classList.add("used");
      btn.onclick = null;
    } else {
      pill.textContent = "未使用";
      pill.classList.remove("used");
      pill.classList.add("unused");
      btn.textContent = "利用する ›";
      btn.classList.remove("used");
      btn.classList.add("unused");
      btn.onclick = setUsed;
    }
  }

  applyPosition();
  setBackground();
  renderState();
  window.addEventListener("resize", applyPosition);
</script>
</body>
</html>
